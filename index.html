<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#347b48"><title>HENOVA • Chicken Farm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6f3df;color:#284a30;font:700 15px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}main{max-width:520px;margin:auto;min-height:100vh;padding:20px 16px 90px;background:linear-gradient(#ecffe1,#fffdf2)}header,.stats,.between,.item,nav{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:14px}header strong{font-size:27px;color:#267641;letter-spacing:2px}header small{display:block;font-size:10px;letter-spacing:2px;color:#92a287}header button,.small{border:0;border-radius:14px;background:#fff;padding:10px;color:#38763f}.stats>div{flex:1;background:white;border-radius:15px;padding:13px;text-align:center;box-shadow:0 5px 18px #294e2012}.stats b{display:block;font-size:21px}.stats small{font-size:10px;color:#93a38e}.title{margin:23px 0 12px;font-size:22px}.scene{height:265px;border:5px solid white;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(#83ceee 0 53%,#8ed16a 53% 100%);box-shadow:0 8px 24px #294e2033}.cloud{position:absolute;top:7px;font-size:38px}.house{position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:110px}.chickens{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:space-evenly;font-size:42px}.flowers{position:absolute;bottom:3px;width:100%;text-align:center}.panel,.item{border-radius:19px;background:#fff;border:1px solid #d9e9cf;padding:17px;margin:13px 0;box-shadow:0 3px 12px #314d2110}.bar{height:15px;background:#e7f3e1;border-radius:20px;overflow:hidden;margin:13px 0}.bar>div{background:linear-gradient(90deg,#93ce63,#ffcc52);height:100%;transition:width .3s}.muted{color:#829b80;font-size:12px}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(#ffe17d,#f0af3e);box-shadow:0 4px #c48a32;color:#523d11;font-weight:900;margin-top:10px}.primary:disabled{opacity:.5}.item .face{font-size:39px;background:#e6f4d8;border-radius:13px;padding:10px}.item .grow{flex:1}.item h3{font-size:15px;margin:0}.item p{margin:5px 0;font-size:12px;color:#6b9c67}.item button{border:0;background:#f5c253;padding:10px;border-radius:12px;font-size:12px;font-weight:900}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);height:78px;padding-bottom:env(safe-area-inset-bottom);max-width:520px;width:100%;background:white;box-shadow:0 -3px 18px #38632d19;border-radius:18px 18px 0 0}nav button{flex:1;background:none;border:0;color:#9eae99;font-size:10px;padding:8px 0}nav button span{display:block;font-size:23px}nav button.active{color:#368950;font-weight:900}.badge{font-size:11px;background:#fff3cb;border-radius:9px;padding:6px}.cover{background:#266a4a;color:white;border-radius:22px;padding:26px;text-align:center}.cover strong{font-size:35px}.cover p{color:#d0edcf}select,input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid #c6dfc3;background:white;font:inherit}.overlay{position:fixed;inset:0;background:#102e1e99;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(420px,100%);background:white;border-radius:20px;padding:22px}.hidden{display:none!important}.notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#24593e;color:white;padding:13px 20px;border-radius:14px;z-index:12;white-space:nowrap;max-width:95vw;overflow:hidden}.warning{font-size:12px;color:#9b662c;margin:10px 0}
</style></head><body><main><header><div>🥚 <strong>HENOVA</strong><small>CHICKEN FARM</small></div><button onclick="settings()">⚙️</button></header><div class="stats"><div>🥚 <b id="balance">0</b><small>EGGS</small></div><div>🪙 <b id="coins">0</b><small>COINS</small></div></div><div id="view"></div></main><nav id="nav"></nav>
<div id="overlay" class="overlay hidden" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>⚙️ Settings</h2><label>Language</label><select id="lang" onchange="changeLang(this.value)"><option value="en">English</option><option value="ar">العربية</option><option value="tr">Türkçe</option></select><p class="muted">HENOVA demo • No real payments</p><button class="primary" onclick="closeModal()">Close</button></div></div><div id="notice" class="notice hidden"></div>
<script>
const K='henova-demo-v1', hr=3600000, H=[['starter','🐔','Starter Hen',10,0],['red','🐓','Red Hen',30,1000],['gold','🐤','Golden Hen',60,3000],['royal','👑','Royal Hen',120,10000],['legend','🌟','Legendary Hen',250,25000]];
const L={en:['Farm','Packs','Tasks','Friends','Wallet','Collect Eggs','Buy','Withdraw'],ar:['المزرعة','الدجاج','المهام','الأصدقاء','المحفظة','جمع البيض','شراء','سحب'],tr:['Çiftlik','Paketler','Görevler','Arkadaşlar','Cüzdan','Yumurtaları Topla','Satın Al','Çek']};
let s;try{s=JSON.parse(localStorage.getItem(K))||{}}catch{s={}}s={eggs:0,coins:0,hen:{starter:1},start:Date.now(),daily:'',lang:'en',...s};s.hen={starter:1,...s.hen};let tab=0;
const num=n=>Number(n).toLocaleString('en-US'),t=()=>L[s.lang]||L.en,save=()=>localStorage.setItem(K,JSON.stringify(s)),time=n=>String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const rate=()=>H.reduce((a,h)=>a+h[3]*(s.hen[h[0]]||0),0),prod=()=>Math.min(60,Math.floor(Math.max(0,Date.now()-s.start)*rate()/hr));
function toast(m){let n=document.getElementById('notice');n.textContent=m;n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add('hidden'),2700)}
function collect(){let q=prod();if(!q)return toast('No eggs available yet');s.eggs+=q;s.start=Date.now();save();render();toast('+'+q+' eggs collected!')}
function purchase(id){let h=H.find(x=>x[0]===id);if(!h||!h[4])return;if(s.coins<h[4])return toast('Not enough Coins');s.coins-=h[4];s.hen[id]=(s.hen[id]||0)+1;save();render();toast('New hen added!')}
function daily(){let d=new Date().toLocaleDateString('en-CA');if(s.daily===d)return;s.daily=d;s.coins+=100;save();render();toast('+100 Coins!')}
function invite(){let id=window.Telegram?.WebApp?.initDataUnsafe?.user?.id;let u='https://t.me/HenovaEggsBot'+(id?'?startapp=ref_'+id:'');navigator.clipboard?.writeText(u).then(()=>toast('Invite link copied')).catch(()=>toast(u))}
function settings(){document.getElementById('lang').value=s.lang;document.getElementById('overlay').classList.remove('hidden')}
function closeModal(){document.getElementById('overlay').classList.add('hidden')}
function changeLang(x){s.lang=x;save();render()}
function openTab(i){tab=i;render()}
function render(){
const el=document.getElementById('view');document.getElementById('balance').textContent=num(s.eggs);document.getElementById('coins').textContent=num(s.coins);
const names=t(),icons=['🏡','🐣','📋','👥','💰'];document.getElementById('nav').innerHTML=icons.map((v,i)=>'<button class="'+(i===tab?'active':'')+'" onclick="openTab('+i+')"><span>'+v+'</span>'+names[i]+'</button>').join('');
document.querySelector('main').dir=s.lang==='ar'?'rtl':'ltr';
if(tab===0){let p=prod(),r=rate(),secs=Math.max(0,Math.ceil((60-p)*hr/r/1000));el.innerHTML='<h1 class="title">🌿 '+names[0]+'</h1><section class="scene"><span class="cloud" style="left:15px">☁️</span><span class="cloud" style="right:19px">☁️</span><div class="house">🏡</div><div class="chickens"><span>🐔</span><span>🐓</span><span>🐣</span></div><div class="flowers">🌼 🌿 🍀 🌼</div></section><section class="panel"><div class="between"><b>🥚 Egg basket</b><b id="basket">'+p+' / 60</b></div><div class="bar"><div id="progress" style="width:'+p/60*100+'%"></div></div><div class="between muted"><span>⚡ '+num(r)+' eggs/hour</span><span id="clock">'+(p>=60?'Basket full':time(secs))+'</span></div><button class="primary" id="collect" onclick="collect()" '+(!p?'disabled':'')+'>'+names[5]+' · '+p+' 🥚</button></section><section class="panel between"><span>🐔 My hens: '+Object.values(s.hen).reduce((a,b)=>a+b,0)+'</span><span>💎 0.0001 GRAM / egg</span></section>'}
if(tab===1)el.innerHTML='<h1 class="title">🐣 '+names[1]+'</h1><p class="muted">Additional hens fill your shared 60-egg basket faster.</p>'+H.map(h=>'<article class="item"><div class="face">'+h[1]+'</div><div class="grow"><h3>'+h[2]+'</h3><p>⚡ '+h[3]+' eggs/hour</p><small>Owned: '+(s.hen[h[0]]||0)+'</small></div>'+(h[4]?'<button onclick="purchase(\''+h[0]+'\')">'+num(h[4])+' 🪙<br>'+names[6]+'</button>':'<b>FREE</b>')+'</article>').join('')+'<p class="warning">Pack prices are provisional demo settings.</p>';
if(tab===2){let claimed=s.daily===new Date().toLocaleDateString('en-CA');el.innerHTML='<h1 class="title">🎁 '+names[2]+'</h1><article class="item"><span class="face">🎁</span><div class="grow"><h3>Daily Login</h3><p>+100 Coins / day</p></div><button onclick="daily()" '+(claimed?'disabled':'')+'>'+(claimed?'Claimed':'Claim')+'</button></article><article class="panel"><h3>More tasks are coming soon</h3><p class="muted">Ad, channel, and partner rewards will be added with server-side verification.</p></article>'}
if(tab===3)el.innerHTML='<h1 class="title">🤝 '+names[3]+'</h1><section class="cover"><div style="font-size:55px">🐣🎁</div><h2>Grow together!</h2><p>Invite friends to your chicken farm.</p><button class="primary" onclick="invite()">📋 Copy invite link</button></section><article class="panel"><b>🏆 Leaderboards — Coming soon</b><p class="muted">Referral rewards require verification on the server.</p></article>';
if(tab===4)el.innerHTML='<h1 class="title">💰 '+names[4]+'</h1><section class="cover"><small>AVAILABLE EGGS</small><div><strong>🥚 '+num(s.eggs)+'</strong></div><p>≈ '+(s.eggs*.0001).toFixed(4)+' GRAM</p></section><section class="panel"><div class="between"><b>'+names[7]+'</b><span class="badge">DEMO ONLY</span></div><p>Minimum: <b>50 eggs</b> = 0.005 GRAM</p><p>Withdrawal frequency: once every 24 hours</p><label class="muted">Eggs to withdraw</label><input id="qty" type="number" value="50" min="50"><p class="warning">Payouts and deposits are disabled until a secure, funded payment backend is configured.</p><button class="primary" disabled>Withdraw • Coming soon</button></section>';
}
render();setInterval(()=>{if(tab!==0)return;let p=prod(),r=rate(),secs=Math.max(0,Math.ceil((60-p)*hr/r/1000));let a=document.getElementById('basket'),b=document.getElementById('progress'),c=document.getElementById('clock'),d=document.getElementById('collect');if(a&&b&&c&&d){a.textContent=p+' / 60';b.style.width=p/60*100+'%';c.textContent=p>=60?'Basket full':time(secs);d.disabled=!p;d.textContent=t()[5]+' · '+p+' 🥚'}},1000);
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch{}
</script></body></html>
