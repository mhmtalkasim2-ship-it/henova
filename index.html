/* HENOVA v1.1 illustrated farm + power fan upgrades */

body{background:#d9e9d2}

async function henovaSignAdminPayout(id){
 try{
  // GRAM is native TON. Never equate a wallet signature or BOC receipt with confirmed settlement.
  // Signing requires a server-authorized intent; payouts stay locked server-side until independently verified.
  const {intent}=await henovaCall('admin_payout_intent',{withdrawalId:id});
  if(!henovaTonUI){henovaTonUI=new window.TON_CONNECT_UI.TonConnectUI({
    manifestUrl:'https://mhmtalkasim2-ship-it.github.io/henova/tonconnect-manifest.json'
  });}
  if(!henovaTonUI.wallet){await henovaTonUI.openModal();toast('Connect HENOVA Payouts, then press Sign again.');return;}
  // TON Connect exposes a raw address; the treasury setting is user-friendly.
  // Compare the same account format before asking Tonkeeper to sign.
  const raw=String(henovaTonUI.wallet.account.address||'').toLowerCase();
  const expected=String(intent.sender||'');
  const bytes=Uint8Array.from(atob(expected.replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0));
  if(bytes.length!==36)throw Error('Invalid configured treasury address');
  const workchain=bytes[1]>127?bytes[1]-256:bytes[1];
  const expectedRaw=workchain+':'+Array.from(bytes.slice(2,34),b=>b.toString(16).padStart(2,'0')).join('');
  if(raw!==expectedRaw)throw Error('Wrong wallet connected. Connect HENOVA Payouts before signing.');
  if(henovaSignAdminPayout.inProgress)throw Error('Signature request already in progress');
  henovaSignAdminPayout.inProgress=true;
  try{
  const transaction=await henovaTonUI.sendTransaction({
    validUntil:Math.floor(Date.now()/1000)+300,
    network:'-239',from:expected,
    messages:[{address:intent.destination,amount:intent.amountNanograms}]
  });
  if(!transaction?.boc)throw Error('Wallet returned no signed transaction receipt. Do not sign again; check the blockchain.');
  const bocBytes=Uint8Array.from(atob(transaction.boc.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',bocBytes));
  const signedBocHash=Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');
  const receipt=await henovaCall('admin_record_signed_payout',{
    withdrawalId:id,signedBoc:transaction.boc,destination:intent.destination,
    amountNanograms:intent.amountNanograms
  });
  if(!receipt?.ok)throw Error('Signed transfer receipt was not stored. Do NOT approve it again.');
  toast('Signed payment saved. Checking TON confirmation automatically.');
  henovaTrackAdminPayout(id);
  await henovaShowAdminPayouts();
  }finally{henovaSignAdminPayout.inProgress=false;}
 }catch(e){toast('Payment not confirmed: '+String(e.message||e).slice(0,130))}
}

// Prepare an expiring TON Proof challenge. Verification on the server is not yet active.
async function henovaPrepareWalletProof(){
 const status=document.getElementById('henova-tonconnect-status');
 try{
  if(!henovaTonUI?.wallet?.account?.address)throw Error('Connect Tonkeeper first.');
  const address=document.getElementById('henova-ton-wallet')?.value.trim();
  if(!address)throw Error('Save your withdrawal wallet address first.');
  // Refuse a proof challenge for a payout address that differs from the connected account.
  const connected=String(henovaTonUI.wallet.account.address||'');
  function walletRaw(a){
   if(/^-?\d+:[0-9a-fA-F]{64}$/.test(a))return a.toLowerCase();
   const raw=Uint8Array.from(atob(a.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
   if(raw.length!==36)throw Error('Invalid TON wallet address');
   const wc=raw[1]>127?raw[1]-256:raw[1];
   return wc+':'+Array.from(raw.slice(2,34),b=>b.toString(16).padStart(2,'0')).join('');
  }
  if(walletRaw(connected)!==walletRaw(address))throw Error('Connected Tonkeeper wallet differs from saved withdrawal address.');
  const challenge=await henovaCall('wallet_proof_challenge',{address});
  if(!challenge?.payload)throw Error('Proof challenge unavailable');
  henovaTonUI.setConnectRequestParameters({state:'ready',value:{tonProof:challenge.payload}});
  if(status)status.textContent='Challenge prepared. Reconnect Tonkeeper to request a proof. Withdrawals remain disabled until server verification is completed.';
  toast('Verification challenge prepared. Reconnect Tonkeeper. No payout was initiated.');
 }catch(e){const message=String(e?.message||'unknown_error');if(status)status.textContent='Wallet verification: '+message;toast(message.length>110?message.slice(0,110):message);}
}

function henovaBirdChirp(){
 if(window.henovaMuted||document.hidden||!henovaMorningContext)return;
 const ctx=henovaMorningContext,t=ctx.currentTime;
 // Three soft sliding notes imitate birds in the distance, not loud music.
 for(let i=0;i<3;i++){
  const osc=ctx.createOscillator(),gain=ctx.createGain(),start=t+i*.14;
  osc.type='sine';
  osc.frequency.setValueAtTime(1850+Math.random()*500,start);
  osc.frequency.exponentialRampToValueAtTime(2650+Math.random()*600,start+.085);
  osc.frequency.exponentialRampToValueAtTime(2000,start+.17);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(.008,start+.045);
  gain.gain.exponentialRampToValueAtTime(.0001,start+.18);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.19);
 }
}

    henovaCluckAudio.currentTime=0;
    const playPromise=henovaCluckAudio.play();
    if(playPromise && typeof playPromise.catch==='function')playPromise.catch(()=>{});
    clearTimeout(window.henovaCluckStop);
    window.henovaCluckStop=setTimeout(()=>{
      if(henovaCluckAudio && !henovaCluckAudio.paused)henovaCluckAudio.pause();
    },2100);
  }catch(error){console.warn('Real hen recording unavailable',error);}
}
function henovaTapHen(event){

/* Keep feeder contact aligned to its rendered trough bowl, not viewport vw/vh.
   Offset coordinates are stable even while CSS translate animation is running. */
function henovaAlignFeedingToTrough(){
  const scene=document.getElementById('farm-scene');
  if(!scene)return;
  const hen=scene.querySelector('.farm-hen.hen-a');
  const feeder=scene.querySelector('.v3-feeder');
  if(!hen||!feeder||!feeder.offsetWidth||!hen.offsetWidth)return;
  const henWidth=hen.offsetWidth;
  const henHeight=hen.offsetHeight||henWidth*220/240;
  const feederWidth=feeder.offsetWidth;
  const feederHeight=feeder.offsetHeight;
  const artworkHeight=Math.min(feederHeight,feederWidth*135/380);
  const artworkTop=(feederHeight-artworkHeight)/2;
  // Facing left: beak at 3% of hen width; aim near the bowl's right half.
  const beakTargetX=feeder.offsetLeft+feederWidth*.79;
  const beakTargetY=feeder.offsetTop+artworkTop+artworkHeight*.47;
  // Reserve room for the beak to lower into the food during each peck.
  const landingX=beakTargetX-henWidth*.04;
  const landingY=beakTargetY-henHeight*.382-henWidth*.20;
  const dx=landingX-hen.offsetLeft;
  const dy=landingY-hen.offsetTop;
  hen.style.setProperty('--hen-feed-x',Math.round(dx)+'px');
  hen.style.setProperty('--hen-feed-y',Math.round(dy)+'px');
  // Rise vertically on dry ground before moving sideways toward the feed bowl.
  hen.style.setProperty('--hen-safe-x',Math.round(dx*.04)+'px');
  hen.style.setProperty('--hen-safe-y',Math.round(dy*.55)+'px');
  hen.style.setProperty('--hen-approach-x',Math.round(dx*.12)+'px');
  hen.style.setProperty('--hen-approach-y',Math.round(dy*.92)+'px');
}

function showFullscreenStatus(message){
  const el=document.getElementById('fullscreen-status');
  if(el){el.textContent=message;el.title=message;}
}
function toggleTelegramFullscreen(){
  const app=window.Telegram?.WebApp;
  if(!app){toast('Open from Telegram to use fullscreen');return;}
  if(!app.isVersionAtLeast?.('8.0') || typeof app.requestFullscreen!=='function'){
    toast('Update Telegram to use fullscreen');return;
  }
  try{
    if(app.isFullscreen){app.exitFullscreen?.();return;}
    app.requestFullscreen();
    showFullscreenStatus('Requesting fullscreen');
  }catch(error){toast('Fullscreen request failed');showFullscreenStatus(String(error));}
}
/* One-off administrator connectivity test, only from an explicit Telegram startapp link.
   No balances, eggs, purchases, or visuals are modified. Server enforces admin ID. */
async function henovaAdminConnectionTest(){
  const app=window.Telegram?.WebApp;
  if(!app?.initData || app.initDataUnsafe?.start_param!=='henova_admin_test')return;
  try{
    const response=await fetch('https://gnkyduafxivfyrpoznnp.supabase.co/functions/v1/henova-api',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'diagnostic',initData:app.initData}),
      cache:'no-store'
    });
    const result=await response.json();
    if(response.ok && result?.ok===true && result?.auth==='telegram_verified' && result?.database==='connected'){
      toast('HENOVA server connection verified ✓');
    }else{
      toast('HENOVA server test: '+String(result?.error||'unavailable').slice(0,60));
    }
  }catch(error){
    console.warn('HENOVA diagnostic network unavailable',error);
    toast('HENOVA server test: connection unavailable');
  }
}
function setupTelegram(){
  const app=window.Telegram?.WebApp;
  if(!app){showFullscreenStatus('Browser preview');return;}
  try{
    app.onEvent?.('fullscreenChanged',()=>{
      document.documentElement.classList.toggle('telegram-fullscreen',!!app.isFullscreen);
      showFullscreenStatus(app.isFullscreen?'Fullscreen active':'Fullscreen off');
      const button=document.getElementById('fullscreen-toggle');
      if(button)button.textContent=app.isFullscreen?'⤢':'⛶';
    });
    app.onEvent?.('fullscreenFailed',(data)=>{
      const reason=data?.error||'UNKNOWN';
      showFullscreenStatus('Fullscreen unavailable: '+reason);
      toast(reason==='UNSUPPORTED'?'Fullscreen not supported here':'Fullscreen: '+reason);
    });
    app.ready();
    henovaAdminConnectionTest();
    app.expand();
    app.setHeaderColor?.('#347b48');
    app.setBackgroundColor?.('#72b452');
    // Fullscreen is intentionally manual. Auto-fullscreen can make Telegram
    // overlay a black floating exit control on top of the farm's bottom UI.
    showFullscreenStatus('Fullscreen available from the top control');
  }catch(error){
    showFullscreenStatus('Fullscreen setup failed');
    console.warn('Telegram fullscreen setup error:',error);
  }
}

    });

}
