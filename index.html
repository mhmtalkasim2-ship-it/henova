<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#347b48"><title>HENOVA • Chicken Farm</title>
<style>

em .grow{flex:1}.item h3{font-size:15px;margin:0}.item p{margin:5px 0;font-size:12px;color:#6b9c67}.item button{border:0;background:#f5c253;padding:10px;border-radius:12px;font-size:12px;font-weight:900}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);height:78px;padding-bottom:env(safe-area-inset-bottom);max-width:520px;width:100%;background:white;box-shadow:0 -3px 18px #38632d19;border-radius:18px 18px 0 0}nav button{flex:1;background:none;border:0;color:#9eae99;font-size:10px;padding:8px 0}nav button span{display:block;font-size:23px}nav button.active{color:#368950;font-weight:900}.badge{font-size:11px;background:#fff3cb;border-radius:9px;padding:6px}.cover{background:#266a4a;color:white;border-radius:22px;padding:26px;text-align:center}.cover strong{font-size:35px}.cover p{color:#d0edcf}select,input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid #c6dfc3;background:white;font:inherit}.overlay{position:fixed;inset:0;background:#102e1e99;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(420px,100%);background:white;border-radius:20px;padding:22px}.hidden{display:none!important}.notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#24593e;color:white;padding:13px 20px;border-radius:14px;z-index:12;white-space:nowrap;max-width:95vw;overflow:hidden}.warning{font-size:12px;color:#9b662c;margin:10px 0}

/* HENOVA v1.1 illustrated farm + power fan upgrades */
:root{--leaf:#267b4a;--gold:#ffc657}
body{background:#d9e9d2}
main{background:linear-gradient(180deg,#def5ed 0%,#f5f9e6 45%,#fff9e8 100%)}
.title{color:#285b3e;text-shadow:0 2px 0 #fff}
.stats>div{border:1px solid #ffffffcc;background:linear-gradient(145deg,#fffefa,#ecf7e7);box-shadow:0 8px 17px #1d642023}
.scene{height:340px;background:linear-gradient(#69bce8 0%,#a3dcf8 47%,#bdeca0 48%,#74bd59 100%);border:6px solid #fff8e7;box-shadow:0 12px 0 #bcd7a1,0 20px 30px #316b3233}
.scene:before{content:"";position:absolute;width:130%;height:90px;left:-15%;bottom:-12px;border-radius:50% 50% 0 0;background:repeating-linear-gradient(110deg,#7fca60 0 24px,#78c356 25px 53px);opacity:.6}
.scene .cloud{color:#fff;filter:drop-shadow(0 5px 2px #ffffff66);animation:floaty 6s ease-in-out infinite}
.farm-path{position:absolute;bottom:-40px;left:38%;height:155px;width:105px;background:#e7c794;transform:perspective(110px) rotateX(25deg);border:3px solid #c99e67;border-radius:55% 55% 0 0}
.hen-barn{position:absolute;bottom:93px;left:18%;height:125px;width:142px;background:repeating-linear-gradient(90deg,#c85b3d 0 26px,#d96c46 27px 31px);border:6px solid #fff1ce;border-radius:7px;box-shadow:8px 10px 0 #578e4c59}
.hen-barn:before{content:"";position:absolute;left:-13px;top:-56px;border-left:78px solid transparent;border-right:78px solid transparent;border-bottom:63px solid #7b4937;filter:drop-shadow(0 -6px 0 #b27a4e)}
.hen-barn:after{content:"";position:absolute;width:51px;height:71px;background:#543c31;left:39px;bottom:-6px;border:6px solid #eedcb8;border-radius:28px 28px 0 0;box-shadow:inset 0 0 0 7px #735343}
.windmill{position:absolute;right:12%;bottom:93px;height:125px;width:87px;filter:drop-shadow(4px 5px 1px #31653a55)}
.tower{position:absolute;bottom:0;left:21px;width:45px;height:105px;background:linear-gradient(90deg,#eee6d9,#fff,#cfc5b4);border:4px solid #b38d6b;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.rotor{position:absolute;top:-14px;left:42px;width:10px;height:10px;transform-origin:center;animation:windspin 5s linear infinite;z-index:2}
.blade{position:absolute;left:-8px;top:-54px;height:55px;width:25px;background:linear-gradient(90deg,#f7f6e4,#cfecd1);border:3px solid #538c78;border-radius:70% 15% 30% 15%;transform-origin:50% 59px}
.blade:nth-child(2){transform:rotate(120deg)}.blade:nth-child(3){transform:rotate(240deg)}
.rotor-cap{position:absolute;left:-8px;top:-7px;background:#ffc55b;width:26px;height:26px;border:5px solid #cf8e30;border-radius:50%}
.scene .flowers{z-index:4;letter-spacing:9px;font-size:19px;bottom:12px}
.hen-characters{position:absolute;z-index:5;bottom:28px;left:7%;right:7%;display:flex;justify-content:space-between;font-size:46px;animation:chickenwalk 2.7s ease-in-out infinite;filter:drop-shadow(1px 6px 2px #4b8f3c5e)}
.farm-basket{position:absolute;z-index:5;bottom:75px;left:48%;font-size:37px;transform:rotate(-8deg);filter:drop-shadow(0 4px 2px #568d40)}
.power-panel{border:1px solid #f4e1a4;background:linear-gradient(135deg,#fff9db,#f0f8e8);border-radius:20px;padding:16px;margin:18px 0;box-shadow:0 6px 17px #6f883625}
.power-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.power-icon{font-size:31px}.power-stats{font-size:12px;color:#7d8464;margin-top:7px}.power-boost{font-size:24px;font-weight:900;color:#358b59}
.power-btn{border:0;border-radius:11px;background:#4fb96e;color:white;padding:10px 13px;font-weight:900;margin-top:11px;width:100%;box-shadow:0 4px #2c7f45}
.power-btn:disabled{background:#b5c3a3;box-shadow:none}
@keyframes windspin{to{transform:rotate(360deg)}}@keyframes floaty{50%{transform:translateY(-8px)}}@keyframes chickenwalk{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.rotor,.hen-characters,.scene .cloud{animation:none}}

/* HENOVA spacious mobile layout: edge-to-edge farm, compact controls */
html,body{width:100%;overflow-x:hidden}
main{width:100%;max-width:760px;padding:12px 10px 98px}
header{padding:3px 6px;margin-bottom:10px}
.stats{gap:8px}.stats>div{padding:10px 8px;min-width:0;border-radius:14px}.stats b{font-size:20px}
.title{font-size:24px;margin:16px 5px 12px}
.scene{width:calc(100% + 20px);margin-left:-10px;margin-right:-10px;border:0;border-radius:0;height:clamp(355px,74vh,690px);box-shadow:0 8px 20px #316b3230}
.scene .hen-barn{left:15%;bottom:27%;transform:scale(1.20);transform-origin:center bottom}
.scene .windmill{right:13%;bottom:29%;transform:scale(1.23);transform-origin:center bottom}
.scene .farm-path{height:38%;left:37%;bottom:-10%}
.scene .hen-characters{bottom:10%;font-size:clamp(49px,12vw,72px)}
.scene .farm-basket{bottom:22%;left:50%;font-size:43px}
.panel,.power-panel,.item{border-radius:17px;padding:15px;margin:13px 2px}
.bottom-nav,nav{max-width:760px;border-radius:17px 17px 0 0}
@media(min-width:600px){main{padding-left:18px;padding-right:18px}.scene{width:100%;margin:0;border-radius:24px}.scene .hen-barn{left:22%}}

/* Realistic farm artwork v2.0: image layer with graceful fallback */
.scene{background-image:linear-gradient(180deg,#152a1c05,#152a1c13),url('./assets/farm-realistic.jpg');background-size:cover;background-position:center center;background-repeat:no-repeat;min-height:400px;height:clamp(440px,69svh,680px);position:relative}
.scene:has(.realistic-layer){border:0}
.scene .farm-path,.scene .hen-barn,.scene .windmill,.scene .farm-basket,.scene .hen-characters,.scene .flowers,.scene .cloud{transition:opacity .2s ease}
.scene.realistic-ready .farm-path,.scene.realistic-ready .hen-barn,.scene.realistic-ready .windmill,.scene.realistic-ready .farm-basket,.scene.realistic-ready .hen-characters,.scene.realistic-ready .flowers,.scene.realistic-ready .cloud{opacity:0;pointer-events:none}
.scene .farm-photo-shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,#101f170e,transparent 25%,transparent 75%,#08291235)}
@media(max-width:450px){.scene{height:clamp(420px,67svh,610px)}}

/* HENOVA immersive farm — full-screen reference-inspired composition */
body:has(main.farm-mode){background:#6aa34b}
main.farm-mode{height:100dvh;min-height:640px;max-width:100%;overflow:hidden;padding:0;background:#7ebf54;position:relative;isolation:isolate}

main.farm-mode .stats small{font-size:10px;margin-left:auto}

main.farm-mode .scene:before{display:none}
main.farm-mode .scene .hen-barn{bottom:41%;left:9%;transform:scale(1.34)}
main.farm-mode .scene .windmill{bottom:42%;right:13%;transform:scale(1.45)}
main.farm-mode .scene .farm-path{bottom:6%;height:46%;left:36%}
main.farm-mode .scene .hen-characters{bottom:22%;font-size:56px}
main.farm-mode .scene .farm-basket{bottom:41%;left:43%}
main.farm-mode .scene .flowers{bottom:20%;font-size:22px}
main.farm-mode .scene .cloud{top:25%;opacity:.65}
.orchard{position:absolute;inset:0;pointer-events:none;z-index:1}
.orchard .tree-art{position:absolute;line-height:1;font-size:clamp(72px,19vw,155px);filter:drop-shadow(0 10px 4px #254d2688)}
.orchard .tree-art:nth-child(1){top:1%;left:-6%}.orchard .tree-art:nth-child(2){top:2%;right:-8%}.orchard .tree-art:nth-child(3){top:21%;left:-10%}.orchard .tree-art:nth-child(4){top:30%;right:-11%}.orchard .tree-art:nth-child(5){bottom:18%;left:-13%}.orchard .tree-art:nth-child(6){bottom:20%;right:-12%}
main.farm-mode #view>.panel{position:absolute;z-index:15;bottom:calc(env(safe-area-inset-bottom) + 96px);left:12px;right:12px;margin:0;padding:12px 15px;background:#f4f5dded;border:2px solid #fff8e2;border-radius:23px;box-shadow:0 8px 18px #31441e66;backdrop-filter:blur(9px)}
main.farm-mode .panel .bar{margin:6px 0}
main.farm-mode .panel .harvest-stats,main.farm-mode .panel .between.muted{margin:3px 0 0}
main.farm-mode .panel .primary{padding:12px;margin-top:6px}
main.farm-mode .power-panel{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 259px);left:12px;right:12px;z-index:13;padding:9px 12px;margin:0;background:#f6efc9e8;backdrop-filter:blur(7px);border-radius:16px}

</style></head><body><main><header><div>🥚 <strong>HENOVA</strong><small>CHICKEN FARM</small></div><button onclick="settings()">⚙️</button></header><div class="stats"><div>🥚 <b id="balance">0</b><small>EGGS</small></div><div>🪙 <b id="coins">0</b><small>COINS</small></div></div><div id="view"></div></main><nav id="nav"></nav>
<div id="overlay" class="overlay hidden" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>⚙️ Settings</h2><label>Language</label><select id="lang" onchange="changeLang(this.value)"><option value="en">English</option><option value="ar">العربية</option><option value="tr">Türkçe</option></select><p class="muted">HENOVA demo • No real payments</p><button class="primary" onclick="closeModal()">Close</button></div></div><div id="notice" class="notice hidden"></div>
<script>
const K='henova-demo-v1', hr=3600000, H=[['starter','🐔','Starter Hen',10,0],['red','🐓','Red Hen',30,1000],['gold','🐤','Golden Hen',60,3000],['royal','👑','Royal Hen',120,10000],['legend','🌟','Legendary Hen',250,25000]];
const L={en:['Farm','Packs','Tasks','Friends','Wallet','Collect Eggs','Buy','Withdraw'],ar:['المزرعة','الدجاج','المهام','الأصدقاء','المحفظة','جمع البيض','شراء','سحب'],tr:['Çiftlik','Paketler','Görevler','Arkadaşlar','Cüzdan','Yumurtaları Topla','Satın Al','Çek']};
let s;try{s=JSON.parse(localStorage.getItem(K))||{}}catch{s={}}s={eggs:0,coins:0,hen:{starter:1},start:Date.now(),daily:'',lang:'en',fan:0,...s};s.hen={starter:1,...s.hen};let tab=0;
const num=n=>Number(n).toLocaleString('en-US'),t=()=>L[s.lang]||L.en,save=()=>localStorage.setItem(K,JSON.stringify(s)),time=n=>String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const rate=()=>H.reduce((a,h)=>a+h[3]*(s.hen[h[0]]||0),0)*(1+[0,.10,.20,.35,.50,.75][Math.min(5,s.fan||0)]),prod=()=>Math.min(60,Math.floor(Math.max(0,Date.now()-s.start)*rate()/hr));
function toast(m){let n=document.getElementById('notice');n.textContent=m;n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add('hidden'),2700)}
function collect(){let q=prod();if(!q)return toast('No eggs available yet');s.eggs+=q;s.start=Date.now();save();render();toast('+'+q+' eggs collected!')}
function purchase(id){let h=H.find(x=>x[0]===id);if(!h||!h[4])return;if(s.coins<h[4])return toast('Not enough Coins');s.coins-=h[4];s.hen[id]=(s.hen[id]||0)+1;save();render();toast('New hen added!')}
function upgradeFan(){let lv=s.fan||0,prices=[500,1500,4000,10000,25000];if(lv>=5)return toast('Power Fans are at maximum level');if(s.coins<prices[lv])return toast('Not enough Coins');/* Close elapsed cycle before changing rate to avoid retroactive gains */let pending=prod();s.coins-=prices[lv];s.fan=lv+1;s.start=Date.now()-Math.floor(pending*hr/rate());save();render();toast('Power upgraded to level '+s.fan+'!')}
function daily(){let d=new Date().toLocaleDateString('en-CA');if(s.daily===d)return;s.daily=d;s.coins+=100;save();render();toast('+100 Coins!')}
function invite(){let id=window.Telegram?.WebApp?.initDataUnsafe?.user?.id;let u='https://t.me/HenovaEggsBot'+(id?'?startapp=ref_'+id:'');navigator.clipboard?.writeText(u).then(()=>toast('Invite link copied')).catch(()=>toast(u))}
function settings(){document.getElementById('lang').value=s.lang;document.getElementById('overlay').classList.remove('hidden')}
function closeModal(){document.getElementById('overlay').classList.add('hidden')}
function changeLang(x){s.lang=x;save();render()}
function openTab(i){tab=i;render()}
function prepareFarmArtwork(){let el=document.getElementById('farm-scene');if(!el)return;let im=new Image();im.onload=()=>el.classList.add('realistic-ready');im.onerror=()=>el.classList.remove('realistic-ready');im.src='./assets/farm-realistic.jpg'}
function render(){
const el=document.getElementById('view');document.getElementById('balance').textContent=num(s.eggs);document.getElementById('coins').textContent=num(s.coins);
const names=t(),icons=['🏡','🐣','📋','👥','💰'];document.getElementById('nav').innerHTML=icons.map((v,i)=>'<button class="'+(i===tab?'active':'')+'" onclick="openTab('+i+')"><span>'+v+'</span>'+names[i]+'</button>').join('');
document.querySelector('main').dir=s.lang==='ar'?'rtl':'ltr';document.querySelector('main').classList.toggle('farm-mode',tab===0);
if(tab===0){let p=prod(),r=rate(),secs=Math.max(0,Math.ceil((60-p)*hr/r/1000));el.innerHTML='<h1 class="title">🌿 '+names[0]+'</h1><section class="scene" id="farm-scene"><div class="farm-photo-shade"></div><div class="orchard"><span class="tree-art">🌳</span><span class="tree-art">🌳</span><span class="tree-art">🌳</span><span class="tree-art">🌳</span><span class="tree-art">🌳</span><span class="tree-art">🌳</span></div><span class="cloud" style="left:15px">☁️</span><span class="cloud" style="right:19px">☁️</span><div class="farm-path"></div><div class="hen-barn"></div><div class="windmill"><div class="tower"></div><div class="rotor"><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="rotor-cap"></i></div></div><div class="farm-basket">🧺</div><div class="hen-characters"><span>🐔</span><span>🐓</span><span>🐣</span></div><div class="flowers">🌼 🌿 🍀 🌼</div></section><section class="panel"><div class="between"><b>🥚 Egg basket</b><b id="basket">'+p+' / 60</b></div><div class="bar"><div id="progress" style="width:'+p/60*100+'%"></div></div><div class="between muted"><span>⚡ '+num(r)+' eggs/hour</span><span id="clock">'+(p>=60?'Basket full':time(secs))+'</span></div><button class="primary" id="collect" onclick="collect()" '+(!p?'disabled':'')+'>'+names[5]+' · '+p+' 🥚</button></section><section class="power-panel"><div class="power-head"><div><b>⚡ Power Fans</b><div class="power-stats">Fan level '+(s.fan||0)+' / 5 · Faster egg production</div></div><div class="power-boost">+'+Math.round(([0,.10,.20,.35,.50,.75][s.fan||0])*100)+'%</div></div><button class="power-btn" onclick="upgradeFan()" '+((s.fan||0)>=5?'disabled':'')+'>Upgrade Fans · '+((s.fan||0)>=5?'MAX':num([500,1500,4000,10000,25000][s.fan||0])+' Coins')+'</button></section><section class="panel between"><span>🐔 My hens: '+Object.values(s.hen).reduce((a,b)=>a+b,0)+'</span><span>💎 0.0001 GRAM / egg</span></section>'}
if(tab===1)el.innerHTML='<h1 class="title">🐣 '+names[1]+'</h1><p class="muted">Additional hens fill your shared 60-egg basket faster.</p>'+H.map(h=>'<article class="item"><div class="face">'+h[1]+'</div><div class="grow"><h3>'+h[2]+'</h3><p>⚡ '+h[3]+' eggs/hour</p><small>Owned: '+(s.hen[h[0]]||0)+'</small></div>'+(h[4]?'<button onclick="purchase(\''+h[0]+'\')">'+num(h[4])+' 🪙<br>'+names[6]+'</button>':'<b>FREE</b>')+'</article>').join('')+'<p class="warning">Pack prices are provisional demo settings.</p>';
