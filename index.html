/* HENOVA v1.1 illustrated farm + power fan upgrades */

body{background:#d9e9d2}

    app.onEvent?.('fullscreenFailed',(data)=>{
      const reason=data?.error||'UNKNOWN';
      showFullscreenStatus('Fullscreen unavailable: '+reason);
      toast(reason==='UNSUPPORTED'?'Fullscreen not supported here':'Fullscreen: '+reason);
    });
    app.ready();
    app.expand();
    app.setHeaderColor?.('#347b48');
    app.setBackgroundColor?.('#72b452');
    if(typeof app.requestFullscreen==='function' && app.isVersionAtLeast?.('8.0')){
      app.requestFullscreen();
      showFullscreenStatus('Requesting fullscreen');
    }else{
      showFullscreenStatus('Fullscreen unavailable on this Telegram version');
    }
  }catch(error){
    showFullscreenStatus('Fullscreen setup failed');
    console.warn('Telegram fullscreen setup error:',error);
  }
}
setupTelegram();
</script><span id="fullscreen-status" role="status" aria-live="polite" class="fullscreen-status">Loading Telegram display mode</span></body></html>
