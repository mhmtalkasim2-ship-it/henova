/* HENOVA v1.1 illustrated farm + power fan upgrades */

body{background:#d9e9d2}

let henovaInitialStateSynced=false;
async function henovaCall(action,details={}){
  const initData=window.Telegram?.WebApp?.initData;
  if(!initData)throw Error('Open HENOVA inside Telegram');
  const apiAction=action==='state'&&henovaInitialStateSynced?'state_refresh':action;
  const response=await fetch(HENOVA_API_URL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData,action:apiAction,...details}),cache:'no-store'
  });
  const data=await response.json();
  if(!response.ok || data?.ok===false){const err=new Error(String(data?.error||'server_unavailable'));err.diagnostics=data?.diagnostics||data?.recipient_checks||data?.checked;err.henova=data?.henova===true;err.withdrawals=data?.withdrawals===true;throw err;}

  return data;
}

async function henovaAction(action,item){
  if(!henovaReady)return toast('Connecting to HENOVA server');

  const hens=[...document.querySelectorAll('#farm-scene .farm-hen')].filter(e=>e.getClientRects().length&&e.getBoundingClientRect().width>0).map(e=>e.getBoundingClientRect());
  try{
    // Reuse the identical request ID after network failure: no duplicate payouts.
    const pendingKey='henova-pending-action-v1';
    let pending=null;try{pending=JSON.parse(localStorage.getItem(pendingKey))}catch{}
    if(pending && (pending.action!==action || pending.item!==(item||null))){
      return toast('Previous action pending; retry it first');
    }
    const requestId=pending?.requestId||crypto.randomUUID();
    if(!pending)localStorage.setItem(pendingKey,JSON.stringify({action,item:item||null,requestId}));
    const result=await henovaCall(action,{requestId,...(item?{item}:{})});
    // The action RPC already returns the authoritative updated player state.
    // Reuse it instead of issuing another full state request after every action.
    if(action!=='daily' && result?.already_applied!==true &&
       Number.isFinite(Number(result?.eggs)) && Number.isFinite(Number(result?.coins)) &&
       Number.isFinite(Number(result?.starter)) && result?.production_started_at){
      s.eggs=Number(result.eggs);s.coins=Number(result.coins);
      s.hen={starter:Number(result.starter)||0,red:Number(result.red)||0,
        gold:Number(result.gold)||0,royal:Number(result.royal)||0,legend:Number(result.legend)||0};
      s.fan=Number(result.fan)||0;
      s.start=Date.parse(result.production_started_at)||Date.now();
    }else{
      const fresh=await henovaCall('state');
      henovaApplyState(fresh.state);
    }
    localStorage.removeItem('henova-pending-action-v1');
    render();
    if(action==='collect'){
      const diff=Math.max(0,s.eggs-previousEggs);
      if(diff>0){playCollectEggs(hens,diff);toast('+'+diff+' eggs collected!')}
    }else if(action==='daily'){if(s.coins>=previousCoins+50)henovaShowRewardCard(50,'coins');else toast('Daily reward already claimed')}
    else if(action==='purchase')toast('New hen added!');
    else if(action==='boost')toast('Power upgraded!');
  }catch(error){
    console.warn('HENOVA action not confirmed',error);
    toast(hvError(error.message));
    if(['no_eggs','already_claimed','insufficient_coins','invalid_hen','hen_limit_reached','max_boost','invalid_request_id'].includes(error.message)){
      localStorage.removeItem('henova-pending-action-v1');
    }
    try{const fresh=await henovaCall('state');henovaApplyState(fresh.state);render()}catch{}
  }finally{henovaBusy=false}
}

async function henovaRedeemPromo(){
 if(henovaPromoRedeemBusy)return;
 const input=document.getElementById('henova-promo-input');
 const code=String(input?.value||'').trim().toUpperCase();
 if(!/^[A-Z0-9]{5,24}$/.test(code))return toast(s.lang==='ar'?'أدخل كوداً صالحاً':s.lang==='tr'?'Geçerli bir kod girin':'Enter a valid code');
 if(!window.Telegram?.WebApp?.initData)return toast(s.lang==='ar'?'افتح HENOVA من تيليجرام':s.lang==='tr'?'HENOVA uygulamasını Telegramda aç':'Open HENOVA in Telegram');
 const btn=document.getElementById('henova-promo-redeem');
 const originalLabel=btn?.textContent||'';
 henovaPromoRedeemBusy=true;
 if(btn)btn.disabled=true;
 try{
  const membership=await henovaCall('promo_membership_check');
  if(!membership?.allJoined){
   henovaShowPromoMembershipCard({henova:membership?.henova===true,withdrawals:membership?.withdrawals===true});
   return;
  }
  if(!window.Adsgram?.init)return toast(s.lang==='ar'?'تعذر تحميل خدمة AdsGram. أعد فتح التطبيق.':s.lang==='tr'?'AdsGram yüklenemedi. Uygulamayı yeniden açın.':'AdsGram failed to load. Reopen the app.');
  const session=await henovaCall('promo_ad_start',{code});
  if(!session?.session_id)throw Error('promo_session_unavailable');

  const ad=window.Adsgram.init({blockId:'int-57642',debug:false});
  let adResult;
  try{
   adResult=await ad.show();
   if(!adResult||adResult.done!==true||adResult.error===true){
    console.warn('Promo advertisement did not complete',adResult);
    toast(s.lang==='ar'?'يجب مشاهدة الإعلان حتى النهاية لاستلام مكافأة الكود.':s.lang==='tr'?'Kod ödülünü almak için reklamı sonuna kadar izleyin.':'Please watch the ad to the end to claim the promo reward.');
    return;
   }
  }catch(err){
   console.warn('Promo advertisement unavailable, skipped or failed',err);
   const reason=String(err?.description||err?.message||err||'').toLowerCase();
   if(/no.?ads|no.?fill|not available|not found|no inventory|unavailable|no ads available|banner/.test(reason)){
    toast(s.lang==='ar'?'لا يوجد إعلان متاح حالياً، حاول لاحقاً.':s.lang==='tr'?'Şu anda reklam yok. Daha sonra tekrar deneyin.':'No ads available right now. Please try later.');
   }else{
    toast(s.lang==='ar'?'لم يكتمل الإعلان. حاول مرة أخرى.':s.lang==='tr'?'Reklam tamamlanmadı. Tekrar deneyin.':'The ad did not complete. Please try again.');
   }
   return;
  }

  const checked=await henovaCall('promo_ad_check',{session_id:session.session_id});
  if(!checked?.min_seconds_met){
   henovaAdNotice('short');
   return;
  }

  const r=await henovaCall('redeem_promo_code',{code,session_id:session.session_id});
  if(!r?.ok)throw Error(String(r?.error||'promo_claim_not_confirmed'));
  const fresh=await henovaCall('state');
  if(fresh?.state){henovaApplyState(fresh.state);render();}
  const amount=Number(r.eggs??r.coins??0);
  const isGift=r.rewardType==='gift';
  const unit=(isGift?r.giftRewardType:r.rewardType)==='eggs'?'eggs':'coins';
  if(r.rewardType==='hen'){
   const duration=Math.max(1,Number(r.henDurationHours)||Number(fresh.state?.promoHen?.hen_duration_hours)||1);
   const totalEggs=Math.max(100,Number(r.eggsReward)||Number(r.eggs)||Number(fresh.state?.promoHen?.eggs_reward)||duration*100);
   henovaShowPromoHenRewardCard(duration,totalEggs);
  }else{
   const successMessage=isGift
    ?(s.lang==='ar'?'🎁 مبروك! حصلت على صندوق هدية بقيمة '+amount+' '+(unit==='eggs'?'بيضة.':'عملة.') :s.lang==='tr'?'🎁 Tebrikler! '+amount+' '+(unit==='eggs'?'yumurta':'coin')+' değerinde hediye kutusu kazandın.':'🎁 Congratulations! You received a gift box worth '+amount+' '+unit+'.')
    :(s.lang==='ar'?'✅ تم استلام الكود بنجاح! أضيفت '+amount+' '+(unit==='eggs'?'بيضة إلى رصيدك.':'عملة إلى رصيدك.') :s.lang==='tr'?'✅ Kod başarıyla alındı! Bakiyene '+amount+' '+(unit==='eggs'?'yumurta eklendi.':'coin eklendi.'):'✅ Promo code claimed! '+amount+' '+unit+' added to your balance.');
   toast(successMessage);
   henovaShowRewardCard(amount,unit,isGift);
  }
 }catch(e){
  const reason=String(e?.message||e||'');
  if(reason==='channel_membership_required'){
   henovaShowPromoMembershipCard({henova:e.henova===true,withdrawals:e.withdrawals===true});
  }else if(reason==='membership_verification_unavailable'){
   toast(s.lang==='ar'?'تعذر التحقق من الاشتراك. حاول لاحقاً.':s.lang==='tr'?'Üyelik kontrol edilemiyor. Daha sonra tekrar dene.':'Membership check unavailable. Please try again later.');
  }else if(reason==='ad_verification_required'){
   henovaAdNotice('short');
  }else if(reason==='code_fully_claimed'){
   toast(s.lang==='ar'?'❌ لم تستلم المكافأة: انتهت حصة هذا الكود واستخدمه جميع الأشخاص المسموح لهم.':s.lang==='tr'?'❌ Ödül alınmadı: Bu kodun tüm kullanım hakları doldu.':'❌ Reward not received: this promo code has reached its claim limit.');
  }else if(reason==='already_claimed'){
   toast(s.lang==='ar'?'⚠️ لم تستلم مكافأة جديدة: سبق لك استخدام هذا الكود.':s.lang==='tr'?'⚠️ Yeni ödül verilmedi: Bu kodu daha önce kullandın.':'⚠️ No new reward: you have already claimed this code.');
  }else if(['invalid_code','invalid_or_expired_code'].includes(reason)){
   toast(s.lang==='ar'?'❌ لم تستلم المكافأة: الكود غير صالح أو منتهي الصلاحية.':s.lang==='tr'?'❌ Ödül alınmadı: Kod geçersiz veya süresi dolmuş.':'❌ Reward not received: the code is invalid or expired.');
  }else{
   console.warn('Promo redeem',e);
   toast(s.lang==='ar'?'تعذر بدء الإعلان أو استلام الكود، حاول مرة أخرى.':s.lang==='tr'?'Reklam veya kod işlemi başlatılamadı. Tekrar deneyin.':'Could not start the ad or claim the code. Please try again.');
  }
 }finally{
  henovaPromoRedeemBusy=false;
  const current=document.getElementById('henova-promo-redeem');
  if(current){
   current.disabled=false;
   if(current===btn){
    current.textContent=originalLabel;
    current.style.background='linear-gradient(#93db59,#52a82d)';
   }
  }
 }
}

 if(remaining===0&&!henovaPromoHenRefreshBusy){
  henovaPromoHenRefreshBusy=true;
  try{const fresh=await henovaCall('state');if(fresh?.state){henovaApplyState(fresh.state);render();toast('🐔 Promo hen finished · '+Number(hen.eggs_reward||0).toLocaleString('en-US')+' eggs added!')}}
  catch(e){console.warn('Promo hen expiry refresh failed',e)}
  finally{henovaPromoHenRefreshBusy=false}
 }
},1000);

async function henovaVerifyAdminTest(id){
 const hash=document.getElementById('henova-test-hash-'+id)?.value.trim();
 const output=document.getElementById('henova-test-result-'+id);
 if(!/^[a-fA-F0-9]{64}$/.test(hash||'')){if(output)output.textContent='Enter a 64-character transaction hash.';return;}
 if(output)output.textContent='Checking TON mainnet…';
 try{
  let result;
  try{
   result=await henovaCall('admin_verify_test_transfer',{testId:id,txHash:hash});
  }catch(firstError){
   // This endpoint is read-only; a single retry is safe after a network disconnect.
   if(!/failed to fetch|network|timeout/i.test(String(firstError?.message||firstError)))throw firstError;
   if(output)output.textContent='Connection interrupted. Retrying once…';
   result=await henovaCall('admin_verify_test_transfer',{testId:id,txHash:hash});
  }
  if(output)output.textContent=result.found
   ?'Chain lookup: '+(result.transaction_success?'transaction succeeded':'success not confirmed')+
    ' · Sender: '+(result.sender_matches?'matched':'not matched')+
    ' · Recipient and amount: '+(result.recipient_and_amount_matches?'matched':'not matched')+
    ' · Final settlement: NOT verified'
   :'Transaction not found by chain provider. No payment status changed.';
 }catch(e){if(output)output.textContent='Verification unavailable: '+String(e.message||e);}
}

}

async function henovaBatchApprove(){

 let succeeded=0,failed=0;

  for(const id of ids){
   try{await henovaCall('admin_payout_approve',{withdrawalId:id});henovaBatchSelected.delete(id);approvedIds.push(id);succeeded++}
   catch(e){failed++;console.warn('Batch approval failed for',id,String(e.message||e).slice(0,80))}
  }
 }finally{henovaBatchApproving=false}
 if(approvedIds.length){henovaSigningQueue=approvedIds;henovaSaveSigningQueue()}

 await henovaShowAdminPayouts();
}

async function henovaTrackAdminPayout(id){
 for(let attempt=0;attempt<6;attempt++){
  await new Promise(resolve=>setTimeout(resolve,5500));
  try{
   const r=await henovaCall('admin_track_signed_payout',{withdrawalId:id});
   if(r.confirmed){toast('✅ TON payment confirmed and saved');await henovaShowAdminPayouts();return;}
  }catch(e){if(!['transaction_not_final_or_ambiguous','chain_provider_unavailable','chain_lookup_unavailable','recipient_credit_not_verified'].includes(String(e.message||e)))break;}
 }
 toast('TON confirmation pending. Use Check payment automatically later. Do not sign again.');
 await henovaShowAdminPayouts();
}
async function henovaSignTestThree(){
 if(henovaSignTestThree.inProgress)return toast('Test signature already in progress');
 henovaSignTestThree.inProgress=true;
 try{
  const {intent}=await henovaCall('admin_test_intent',{testId:3});
  if(!window.TON_CONNECT_UI)throw Error('TON Connect not loaded. Reopen HENOVA.');
  if(!henovaTonUI)henovaTonUI=new window.TON_CONNECT_UI.TonConnectUI({
    manifestUrl:'https://mhmtalkasim2-ship-it.github.io/henova/tonconnect-manifest.json'
  });
  if(!henovaTonUI.wallet){await henovaTonUI.openModal();toast('Connect HENOVA Payouts, then press TEST Sign again.');return;}
  const raw=String(henovaTonUI.wallet.account.address||'').toLowerCase();
  const bytes=Uint8Array.from(atob(intent.sender.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  if(bytes.length!==36)throw Error('Invalid treasury wallet');
  const wc=bytes[1]>127?bytes[1]-256:bytes[1];
  const expected=wc+':'+Array.from(bytes.slice(2,34),b=>b.toString(16).padStart(2,'0')).join('');
  if(raw!==expected)throw Error('Wrong Tonkeeper wallet. Select HENOVA Payouts.');
  if(!confirm('TEST #3: Send 0.05 GRAM from HENOVA Payouts to the second wallet? Only sign once.'))return;
  const result=await henovaTonUI.sendTransaction({
   validUntil:Math.floor(Date.now()/1000)+300,
   network:'-239',from:intent.sender,
   messages:[{address:intent.destination,amount:intent.amountNanograms}]
  });
  if(!result?.boc)throw Error('No wallet receipt. Check TON before retrying.');
  toast('TEST signed. Check TON history before retrying. This is not yet recorded as paid.');
 }catch(e){toast('TEST: '+String(e.message||e).slice(0,120));}

async function henovaSignAdminBatch(ids){
 if(henovaSignAdminBatch.inProgress)return toast('Batch signing already in progress');
 henovaSignAdminBatch.inProgress=true;
 let reserved=false;
 try{
  if(!Array.isArray(ids)||ids.length!==5||new Set(ids).size!==5)throw Error('Select exactly five approved requests');
  // Only clear an old local reservation when the SERVER verifies every old request
  // is already confirmed on TON. A device-side cancellation alone is insufficient.
  const previous=localStorage.getItem('henova-last-batch-pending');
  const signedReceipt=localStorage.getItem('henova-last-batch-signing');
  if(previous||signedReceipt){
   const records=[];
   for(const [key,value] of [['henova-last-batch-pending',previous],['henova-last-batch-signing',signedReceipt]]){
    if(!value)continue;
    let record=null;try{record=JSON.parse(value)}catch{}
    if(!record?.batchId||!Array.isArray(record.ids)||record.ids.length!==5
       ||new Set(record.ids.map(Number)).size!==5)
     throw Error('Old batch record needs manual review; do not sign again.');
    records.push({key,...record});
   }
   // Different old batches can be saved under the two keys. Check and clear
   // EACH only after the authoritative server verifies all five payments.
   for(const record of records){
    const result=await henovaCall('admin_batch_reconcile_local',{batchId:record.batchId});
    if(result.can_clear_local_receipt===true){
     localStorage.removeItem(record.key);
     toast('Five previously paid withdrawals verified; stale receipt cleared.');
    }else if(record.key==='henova-last-batch-signing'){
     throw Error('Previous signed batch still needs settlement review; never sign twice.');
    }else if(record.ids.some(x=>!ids.includes(Number(x)))){
     throw Error('Different reserved batch still pending; never sign twice.');
    }else{
     toast('Existing reserved batch found. Reusing its signing attempt.');
    }
   }
  }
  if(!window.TON_CONNECT_UI?.TonConnectUI)throw Error('TON Connect unavailable');
  if(!henovaTonUI)henovaTonUI=new window.TON_CONNECT_UI.TonConnectUI({
   manifestUrl:'https://mhmtalkasim2-ship-it.github.io/henova/tonconnect-manifest.json'
  });
  if(!henovaTonUI.wallet){await henovaTonUI.openModal();toast('Connect HENOVA Payouts then press Pay again.');return}
  const w=henovaTonUI.wallet;
  const feature=(w.device?.features||[]).find(f=>typeof f==='object'&&f.name==='SendTransaction');
  if(Number(feature?.maxMessages||0)<5)throw Error('Connected wallet does not support 5 messages');
  if(String(w.account.chain)!=='-239')throw Error('Connect TON mainnet wallet');
  const queue=await henovaCall('admin_payout_queue');
  if(queue.payments_enabled!==true)throw Error('Real Tonkeeper payouts disabled');
  const expected=String(queue.payout_wallet_address||'');
  const bytes=Uint8Array.from(atob(expected.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  if(bytes.length!==36)throw Error('Invalid treasury address');
  const wc=bytes[1]>127?bytes[1]-256:bytes[1];
  const treasury=wc+':'+Array.from(bytes.slice(2,34),x=>x.toString(16).padStart(2,'0')).join('');
  if(String(w.account.address||'').toLowerCase()!==treasury)throw Error('Wrong wallet. Connect HENOVA Payouts.');
  const saved=localStorage.getItem('henova-last-batch-pending');
  let prior=null;try{prior=saved?JSON.parse(saved):null}catch{}
  const reuse=!!(prior?.batchId&&Array.isArray(prior.ids)&&prior.ids.length===5
    &&prior.ids.every(x=>ids.includes(x)));
  // Reserved requests deliberately fail the fresh-batch preview. For an existing
  // signing reservation, retrieve the authoritative stored transfer details.
  const resumed=reuse
    ?await henovaCall('admin_batch_resume',{batchId:prior.batchId,withdrawalIds:ids})
    :null;
  const review=resumed
    ?{targets:resumed.messages.map(x=>({id:x.withdrawal_id,destination:x.address,
       amountNanograms:x.amount,gram:(Number(BigInt(x.amount))/1e9).toString()}))}
    :await henovaCall('admin_batch_preview',{withdrawalIds:ids});
  if(review.targets.length!==5)throw Error('Incomplete batch preview');
  const detail=review.targets.map(x=>'#'+x.id+' · '+x.gram+' GRAM · '+x.destination).join('\n');
  const total=review.targets.reduce((sum,x)=>sum+BigInt(x.amountNanograms),0n);
  if(!confirm('SEND 5 REAL GRAM PAYOUTS WITH ONE SIGNATURE\n\n'+detail+
   '\n\nTotal: '+(Number(total)/1e9).toFixed(9)+' GRAM + network fees'+
   '\n\nReview all 5 recipients in Tonkeeper. Only sign once. Continue?'))return;
  // Lock the whole group atomically; never unlock automatically on cancel or timeout.
  const intent=resumed||await henovaCall('admin_batch_intent',{withdrawalIds:ids});
  reserved=true;
  if(!reuse)localStorage.setItem('henova-last-batch-pending',JSON.stringify({batchId:intent.batch_id,ids,at:Date.now()}));
  if(intent.messages?.length!==5||intent.sender!==expected)throw Error('Batch intent mismatch; do not sign');
  // The server returns batch items sorted by withdrawal ID; the signing queue
  // can have a different order. Match each item by ID, not by array position.
  const reviewed=new Map(review.targets.map(x=>[Number(x.id),x]));
  if(reviewed.size!==5)throw Error('Duplicate review ID; do not sign');
  for(const b of intent.messages){
   const a=reviewed.get(Number(b.withdrawal_id));
   if(!a||a.destination!==b.address||a.amountNanograms!==b.amount)
    throw Error('Batch content changed; do not sign');
  }
  const result=await henovaTonUI.sendTransaction({
   validUntil:Math.floor(Date.now()/1000)+300,network:'-239',from:intent.sender,
   messages:intent.messages.map(x=>({address:x.address,amount:x.amount}))
  });
  const signedBoc=String(result?.boc||'');
  if(!signedBoc)throw Error('No wallet receipt; inspect TON, never sign twice');
  localStorage.setItem('henova-last-batch-signing',JSON.stringify({batchId:intent.batch_id,signedBoc,ids}));
  const receipt=await henovaCall('admin_batch_signed',{batchId:intent.batch_id,signedBoc});
  if(!receipt.ok)throw Error('Receipt recording pending. Use Recover grouped signing receipt.');
  localStorage.removeItem('henova-last-batch-signing');
  toast('Five-message transaction signed. Check TON settlement; do not sign again.');
  await henovaShowAdminPayouts();
 }catch(e){
  const message=String(e?.message||e||'Unknown error');
  toast((reserved?'Batch reserved; DO NOT SIGN AGAIN. ':'')+message.slice(0,100));
  alert('HENOVA grouped payout stopped BEFORE confirmation.\n\n'+message+'\n\nDo not create a second payment attempt.');
 }
 finally{henovaSignAdminBatch.inProgress=false}
}
async function henovaSignAdminPayout(id){
 if(henovaSignAdminPayout.inProgress)return toast('Signing request already in progress');
 henovaSignAdminPayout.inProgress=true;
 let locked=false;
 try{
  if(!window.TON_CONNECT_UI?.TonConnectUI)throw Error('TON Connect not loaded. Reopen HENOVA.');
  if(!henovaTonUI)henovaTonUI=new window.TON_CONNECT_UI.TonConnectUI({
    manifestUrl:'https://mhmtalkasim2-ship-it.github.io/henova/tonconnect-manifest.json'
  });
  // Connect FIRST. Do not reserve the on-chain signing attempt just to connect.
  if(!henovaTonUI.wallet){
   await henovaTonUI.openModal();
   toast('Connect HENOVA Payouts, then press Sign again. No payment was reserved.');
   return;
  }
  const queue=await henovaCall('admin_payout_queue');
  if(queue.payments_enabled!==true)throw Error('Manual Tonkeeper payout signing is locked');
  const request=(queue.items||[]).find(x=>Number(x.id)===Number(id));
  if(!request||request.status!=='approved')throw Error('Withdrawal not approved');
  if(request.signing_claimed_at||request.signed_boc_hash||request.payout_tx_hash)
   throw Error('Signing already started. Check TON; never sign the same withdrawal again.');
  const expected=String(queue.payout_wallet_address||'');
  const bytes=Uint8Array.from(atob(expected.replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0));
  if(bytes.length!==36)throw Error('Invalid configured payout wallet');
  const workchain=bytes[1]>127?bytes[1]-256:bytes[1];
  const expectedRaw=workchain+':'+Array.from(bytes.slice(2,34),b=>b.toString(16).padStart(2,'0')).join('');
  const raw=String(henovaTonUI.wallet.account.address||'').toLowerCase();
  if(raw!==expectedRaw)throw Error('Wrong wallet connected. Choose HENOVA Payouts.');
  if(String(henovaTonUI.wallet.account.chain||'')!=='-239')throw Error('Connect a TON mainnet wallet');
  const amount=String(request.gram_amount)+' GRAM';
  const destination=String(request.destination_address||'');
  if(!confirm('REAL HENOVA withdrawal #'+id+'\nSend '+amount+' to:\n'+destination+
              '\n\nOnly sign once. Continue to Tonkeeper?'))return;
  // Server atomically reserves a single attempt BEFORE opening the signing prompt.
  const {intent}=await henovaCall('admin_payout_intent',{withdrawalId:id});
  locked=true;
  if(intent.sender!==expected || intent.destination!==destination)
   throw Error('Payment details changed. Do not sign; review the request.');
  let boc='';
  const result=await henovaTonUI.sendTransaction({
    validUntil:Math.floor(Date.now()/1000)+300,
    network:'-239',from:intent.sender,
    messages:[{address:intent.destination,amount:intent.amountNanograms}]
  });
  boc=String(result?.boc||'');
  if(!boc)throw Error('No wallet receipt. Do not sign again. Check Tonkeeper history.');
  // Store a recoverable signed receipt locally before the next network request.
  try{localStorage.setItem('henova-signed-receipt-'+id,JSON.stringify({
   signedBoc:boc,destination:intent.destination,amountNanograms:intent.amountNanograms
  }));}catch{}
  const receipt=await henovaCall('admin_record_signed_payout',{
    withdrawalId:id,signedBoc:boc,destination:intent.destination,
    amountNanograms:intent.amountNanograms
  });
  if(!receipt?.ok)throw Error('Receipt not saved. Use Recover receipt; do not sign again.');
  try{localStorage.removeItem('henova-signed-receipt-'+id);}catch{}
  // Keep the sequence paused until on-chain settlement is confirmed.
  // Signed BOC alone does not prove the transfer was credited.
  toast('Tonkeeper signed #'+id+'. Verifying TON; next payment remains paused.');
  try{
    const chain=await henovaCall('admin_track_signed_payout',{withdrawalId:id});
    if(chain?.confirmed){
      if(henovaSigningQueue[0]===Number(id)){
        henovaSigningQueue.shift();henovaSaveSigningQueue();
      }
      toast('✅ #'+id+' confirmed on TON. Open the next signature from the queue.');
    }else toast('TON verification pending for #'+id+'. Do not sign next yet.');
  }catch(e){toast('TON verification pending. Do not sign next yet.')}
  await henovaShowAdminPayouts();
 }catch(e){
  toast((locked?'Do NOT sign this request again. ':'')+String(e.message||e).slice(0,118));
  if(locked)await henovaShowAdminPayouts().catch(()=>{});
 }finally{henovaSignAdminPayout.inProgress=false;}
}

// Prepare an expiring TON Proof challenge. Verification on the server is not yet active.
async function henovaPrepareWalletProof(){
 const status=document.getElementById('henova-tonconnect-status');
 try{
  if(!henovaTonUI?.wallet?.account?.address)throw Error('Connect Tonkeeper first.');
  const address=document.getElementById('henova-ton-wallet')?.value.trim();
  if(!address)throw Error('Save your withdrawal wallet address first.');
  // Refuse a proof challenge for a payout address that differs from the connected account.
  const connected=String(henovaTonUI.wallet.account.address||'');
  function walletRaw(a){
   if(/^-?\d+:[0-9a-fA-F]{64}$/.test(a))return a.toLowerCase();
   const raw=Uint8Array.from(atob(a.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
   if(raw.length!==36)throw Error('Invalid TON wallet address');
   const wc=raw[1]>127?raw[1]-256:raw[1];
   return wc+':'+Array.from(raw.slice(2,34),b=>b.toString(16).padStart(2,'0')).join('');
  }
  if(walletRaw(connected)!==walletRaw(address))throw Error('Connected Tonkeeper wallet differs from saved withdrawal address.');
  const challenge=await henovaCall('wallet_proof_challenge',{address});
  if(!challenge?.payload)throw Error('Proof challenge unavailable');
  henovaTonUI.setConnectRequestParameters({state:'ready',value:{tonProof:challenge.payload}});
  if(status)status.textContent='Challenge prepared. Reconnect Tonkeeper to request a proof. Withdrawals remain disabled until server verification is completed.';
  toast('Verification challenge prepared. Reconnect Tonkeeper. No payout was initiated.');
 }catch(e){const message=String(e?.message||'unknown_error');if(status)status.textContent='Wallet verification: '+message;toast(message.length>110?message.slice(0,110):message);}
}

/* One click / tap gives a short synthesized chicken-like cluck, without external audio. */
// Soft morning countryside ambiance: small birdsong notes and a rare quiet real hen.
// Browsers require a user gesture to enable audio; keep it muted on hidden pages.
try{window.henovaMuted=localStorage.getItem('henova-sound-muted')==='1'}catch{window.henovaMuted=false}
let henovaMorningContext=null,henovaMorningTimer=null,henovaMorningStarted=false;
function henovaBirdChirp(){
 if(window.henovaMuted||document.hidden||!henovaMorningContext)return;
 const ctx=henovaMorningContext,t=ctx.currentTime;
 // Three soft sliding notes imitate birds in the distance, not loud music.
 for(let i=0;i<3;i++){
  const osc=ctx.createOscillator(),gain=ctx.createGain(),start=t+i*.14;
  osc.type='sine';
  osc.frequency.setValueAtTime(1850+Math.random()*500,start);
  osc.frequency.exponentialRampToValueAtTime(2650+Math.random()*600,start+.085);
  osc.frequency.exponentialRampToValueAtTime(2000,start+.17);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(.008,start+.045);
  gain.gain.exponentialRampToValueAtTime(.0001,start+.18);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.19);
 }
}
function henovaMorningHen(){
 if(window.henovaMuted||document.hidden)return;
 try{
  if(!(henovaCluckAudio instanceof Audio))henovaCluckAudio=new Audio('https://upload.wikimedia.org/wikipedia/commons/4/44/Hen_announcing_shes_lain_an_egg.ogg');
  if(!henovaCluckAudio.paused)return;
  henovaCluckAudio.volume=.13;
  henovaCluckAudio.currentTime=0;
  henovaCluckAudio.play().catch(()=>{});
  setTimeout(()=>{if(henovaCluckAudio&&!henovaCluckAudio.paused)henovaCluckAudio.pause()},2200);
 }catch{}
}
function henovaMorningTick(){

function henovaStopMorning(){

}
function henovaStartMorning(){
 if(window.henovaMuted||document.hidden)return;

 if(!Context)return;
 try{
  henovaMorningContext ||= new Context();
  henovaMorningContext.resume().then(()=>{
   if(window.henovaMuted||document.hidden)return;

/* Keep feeder contact aligned to its rendered trough bowl, not viewport vw/vh.
   Offset coordinates are stable even while CSS translate animation is running. */
function henovaAlignFeedingToTrough(){
  const scene=document.getElementById('farm-scene');
  if(!scene)return;
  const hen=scene.querySelector('.farm-hen.hen-a');
  const feeder=scene.querySelector('.v3-feeder');
  if(!hen||!feeder||!feeder.offsetWidth||!hen.offsetWidth)return;
  const henWidth=hen.offsetWidth;
  const henHeight=hen.offsetHeight||henWidth*220/240;
  const feederWidth=feeder.offsetWidth;
  const feederHeight=feeder.offsetHeight;
  const artworkHeight=Math.min(feederHeight,feederWidth*135/380);
  const artworkTop=(feederHeight-artworkHeight)/2;
  // Facing left: beak at 3% of hen width; aim near the bowl's right half.
  const beakTargetX=feeder.offsetLeft+feederWidth*.79;
  const beakTargetY=feeder.offsetTop+artworkTop+artworkHeight*.47;
  // Reserve room for the beak to lower into the food during each peck.
  const landingX=beakTargetX-henWidth*.04;
  const landingY=beakTargetY-henHeight*.382-henWidth*.20;
  const dx=landingX-hen.offsetLeft;
  const dy=landingY-hen.offsetTop;
  hen.style.setProperty('--hen-feed-x',Math.round(dx)+'px');
  hen.style.setProperty('--hen-feed-y',Math.round(dy)+'px');
  // Rise vertically on dry ground before moving sideways toward the feed bowl.
  hen.style.setProperty('--hen-safe-x',Math.round(dx*.04)+'px');
  hen.style.setProperty('--hen-safe-y',Math.round(dy*.55)+'px');
  hen.style.setProperty('--hen-approach-x',Math.round(dx*.12)+'px');
  hen.style.setProperty('--hen-approach-y',Math.round(dy*.92)+'px');
}

function henovaOwnedHensMarkup(){

 return H.map(h=>{

   const count=Math.max(0,Math.min(HENOVA_MAX_HENS_PER_BREED,Math.floor(Number(s.hen[breed])||0))-(breed==='starter'?1:0));
   const points=HENOVA_HEN_SPOTS[breed];
